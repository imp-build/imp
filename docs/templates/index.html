{% extends "base.html" %}

{% block content %}
<section class="hero">
    <h1>{{ section.title }}</h1>
    <p class="hero__lede">{{ section.description }}</p>
    <div class="hero__actions">
        <a class="button button--primary" href="{{ get_url(path="guide/getting-started/") }}">Get started</a>
        <a class="button" href="{{ get_url(path="reference/js-api/") }}">JS API reference</a>
    </div>
</section>
<section class="content-body">
    {{ section.content | safe }}
</section>
{% endblock content %}
