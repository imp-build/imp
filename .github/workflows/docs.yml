name: Deploy docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build imp
        run: cargo build --release

      - name: Upload imp binary
        uses: actions/upload-artifact@v4
        with:
          name: imp-linux
          path: target/release/imp

  check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download imp binary
        uses: actions/download-artifact@v4
        with:
          name: imp-linux
          path: .

      - name: Make imp executable
        run: chmod +x imp

      - name: Check generated files
        run: ./imp goal generate //ci:docs_workflow --check

  package:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download imp binary
        uses: actions/download-artifact@v4
        with:
          name: imp-linux
          path: .

      - name: Make imp executable
        run: chmod +x imp

      - name: Package docs site
        run: ./imp package //docs:site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs/site/public

  deploy:
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
