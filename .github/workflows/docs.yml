# Generated by ci/gen_workflow.py — do not edit by hand.
# Regenerate with: imp generate //ci:docs_workflow

name: Deploy docs
env:
  IMP_RULES_DIR: ${{ github.workspace }}/rules

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache imp binary
        id: imp-binary
        uses: actions/cache@v4
        with:
          path: target/release/imp
          key: imp-binary-v1-${{ runner.os }}-${{ hashFiles('crates/**/*.rs', '**/Cargo.toml', 'Cargo.lock') }}

      - if: steps.imp-binary.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - if: steps.imp-binary.outputs.cache-hit != 'true'
        uses: kunobi-ninja/kache-action@v1
        with:
          cache-executables: true

      - name: Build imp
        if: steps.imp-binary.outputs.cache-hit != 'true'
        run: cargo build --release --manifest-path crates/imp/Cargo.toml

      - name: Upload imp binary
        uses: actions/upload-artifact@v4
        with:
          name: imp-linux
          path: target/release/imp
          retention-days: 1

  check:
    needs: build
    runs-on: ubuntu-latest
    env:
      IMP_CHANGED_SINCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      IMP_TRACE_ARTIFACTS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export GitHub Actions cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2 || '')

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Download imp binary
        uses: actions/download-artifact@v4
        with:
          name: imp-linux
          path: .

      - name: Make imp executable
        run: chmod +x imp

      - name: Cache imp toolchains
        uses: actions/cache@v4
        with:
          path: ~/.cache/imp/named/__/shared
          key: imp-toolchains-v2-check-${{ runner.os }}-${{ hashFiles('imp.workspace.luau', 'imp.workspace.ci.luau', 'rules/**/*.lock', 'Cargo.lock') }}
          restore-keys: imp-toolchains-v2-check-${{ runner.os }}-

      - name: Cache imp store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/imp
            !~/.cache/imp/named/__/shared
          key: imp-store-v6-check-${{ runner.os }}-${{ hashFiles('imp.workspace.luau', 'imp.workspace.ci.luau', 'rules/**/*.lock') }}-${{ github.run_id }}
          restore-keys: |
            imp-store-v6-check-${{ runner.os }}-${{ hashFiles('imp.workspace.luau', 'imp.workspace.ci.luau', 'rules/**/*.lock') }}-
            imp-store-v6-check-${{ runner.os }}-

      - name: Check generated files
        run: ./imp generate //ci:docs_workflow --changed-since "$IMP_CHANGED_SINCE" --check

      - name: Check formatting
        run: ./imp fmt --check //... --changed-since "$IMP_CHANGED_SINCE"

      - name: Lint
        run: ./imp lint //... --changed-since "$IMP_CHANGED_SINCE"

      - name: Test
        run: ./imp test //... --changed-since "$IMP_CHANGED_SINCE"

      - name: Check Luau workspace coverage
        run: python3 ci/check_luau_workspace.py --imp ./imp

      - name: Documentation quality
        run: ./imp lint //docs && ./imp test //docs

      - name: Package docs site
        run: ./imp package //docs:site

      - name: Cache stats
        run: ./imp cache stats --details

      - name: Cache gc
        run: ./imp cache gc --apply

  package_smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download imp binary
        uses: actions/download-artifact@v4
        with:
          name: imp-linux
          path: .

      - name: Make imp executable
        run: chmod +x imp

      - name: Stage release tree
        run: |
          mkdir -p stage/bin stage/share/imp
          mv imp stage/bin/imp
          cp -r rules stage/share/imp/rules

      - name: Smoke test packaged tree
        run: ci/smoke_package.sh stage

  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Cache imp binary
        id: imp-binary
        uses: actions/cache@v4
        with:
          path: target/release/imp
          key: imp-binary-v1-${{ runner.os }}-${{ hashFiles('crates/**/*.rs', '**/Cargo.toml', 'Cargo.lock') }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build imp
        id: build-imp
        if: steps.imp-binary.outputs.cache-hit != 'true'
        run: cargo build --release --locked --manifest-path crates/imp/Cargo.toml

      - name: Cache imp toolchains
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/imp/named/__/shared
          key: imp-toolchains-v2-macos-${{ runner.os }}-${{ hashFiles('imp.workspace.luau', 'imp.workspace.ci.luau', 'rules/**/*.lock', 'Cargo.lock') }}
          restore-keys: imp-toolchains-v2-macos-${{ runner.os }}-

      - name: Cache imp store
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/imp
            !~/Library/Caches/imp/named/__/shared
          key: imp-store-v6-macos-${{ runner.os }}-${{ hashFiles('imp.workspace.luau', 'imp.workspace.ci.luau', 'rules/**/*.lock') }}-${{ github.run_id }}
          restore-keys: |
            imp-store-v6-macos-${{ runner.os }}-${{ hashFiles('imp.workspace.luau', 'imp.workspace.ci.luau', 'rules/**/*.lock') }}-
            imp-store-v6-macos-${{ runner.os }}-

      - name: Record excluded checks
        run: |
          python3 ci/run_check.py --exclude generate-check imp:2026-10-28-load-odin-rules-without-gcc-on-macos
          python3 ci/run_check.py --exclude fmt imp:2026-10-28-load-odin-rules-without-gcc-on-macos
          python3 ci/run_check.py --exclude lint imp:2026-10-28-load-odin-rules-without-gcc-on-macos
          python3 ci/run_check.py --exclude test imp:2026-10-28-load-odin-rules-without-gcc-on-macos
          python3 ci/run_check.py --exclude luau-workspace imp:2026-10-28-load-odin-rules-without-gcc-on-macos
          python3 ci/run_check.py --exclude docs-lint imp:2026-10-28-load-odin-rules-without-gcc-on-macos
          python3 ci/run_check.py --exclude docs-test imp:2026-10-28-load-odin-rules-without-gcc-on-macos
          python3 ci/run_check.py --exclude consumer-odin imp:2026-10-28-load-odin-rules-without-gcc-on-macos
          python3 ci/run_check.py --exclude consumer-odin-vscode imp:2026-10-28-load-odin-rules-without-gcc-on-macos
          python3 ci/run_check.py --exclude consumer-treesitter imp:2026-10-28-load-odin-rules-without-gcc-on-macos
          python3 ci/run_check.py --exclude package-smoke imp:2026-10-28-load-odin-rules-without-gcc-on-macos
          python3 ci/run_check.py --exclude consumer-oci imp:2026-10-28-build-oci-layers-with-bsd-tar

      - name: lockfiles
        if: ${{ !cancelled() && steps.build-imp.outcome != 'failure' }}
        run: python3 ci/run_check.py lockfiles -- python3 -B rules/workflows/lockfiles/testdata/consumer_check.py --imp target/release/imp --real-lockfile

      - name: cargo-test
        if: ${{ !cancelled() && steps.build-imp.outcome != 'failure' }}
        run: python3 ci/run_check.py cargo-test -- cargo test --workspace --locked --no-fail-fast -- --skip repository_luau_workspace_tests_pass

      - name: consumer-imp-generate
        if: ${{ !cancelled() && steps.build-imp.outcome != 'failure' }}
        run: python3 ci/run_check.py consumer-imp-generate -- python3 -B rules/imp/testdata/generate_consumer_check.py --imp target/release/imp

      - name: consumer-js
        if: ${{ !cancelled() && steps.build-imp.outcome != 'failure' }}
        run: python3 ci/run_check.py consumer-js -- python3 -B rules/js/testdata/consumer_check.py --imp target/release/imp

      - name: consumer-js-biome
        if: ${{ !cancelled() && steps.build-imp.outcome != 'failure' }}
        run: python3 ci/run_check.py consumer-js-biome -- python3 -B rules/js/biome/testdata/consumer_check.py --imp target/release/imp

      - name: consumer-python
        if: ${{ !cancelled() && steps.build-imp.outcome != 'failure' }}
        run: python3 ci/run_check.py consumer-python -- python3 -B rules/python/testdata/consumer_check.py --imp target/release/imp

      - name: consumer-python-ruff
        if: ${{ !cancelled() && steps.build-imp.outcome != 'failure' }}
        run: python3 ci/run_check.py consumer-python-ruff -- python3 -B rules/python/ruff/testdata/consumer_check.py --imp target/release/imp

      - name: consumer-zola
        if: ${{ !cancelled() && steps.build-imp.outcome != 'failure' }}
        run: python3 ci/run_check.py consumer-zola -- python3 -B rules/zola/testdata/consumer_check.py --imp target/release/imp

      - name: Gate on check results
        if: ${{ !cancelled() && steps.build-imp.outcome != 'failure' }}
        run: python3 ci/run_check.py --gate

      - name: Upload macOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-evidence
          path: ci-evidence
          if-no-files-found: error
          retention-days: 30

  package:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2 || '')

      - name: Download imp binary
        uses: actions/download-artifact@v4
        with:
          name: imp-linux
          path: .

      - name: Make imp executable
        run: chmod +x imp

      - name: Cache imp toolchains
        uses: actions/cache@v4
        with:
          path: ~/.cache/imp/named/__/shared
          key: imp-toolchains-v2-package-${{ runner.os }}-${{ hashFiles('imp.workspace.luau', 'imp.workspace.ci.luau', 'rules/**/*.lock', 'Cargo.lock') }}
          restore-keys: imp-toolchains-v2-package-${{ runner.os }}-

      - name: Cache imp store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/imp
            !~/.cache/imp/named/__/shared
          key: imp-store-v6-package-${{ runner.os }}-${{ hashFiles('imp.workspace.luau', 'imp.workspace.ci.luau', 'rules/**/*.lock') }}-${{ github.run_id }}
          restore-keys: |
            imp-store-v6-package-${{ runner.os }}-${{ hashFiles('imp.workspace.luau', 'imp.workspace.ci.luau', 'rules/**/*.lock') }}-
            imp-store-v6-package-${{ runner.os }}-

      - name: Package docs site
        run: ./imp package //docs:site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs/site/public

  deploy:
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
