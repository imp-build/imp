# Generated by ci/gen_workflow.py — do not edit by hand.
# Regenerate with: imp goal generate //ci:docs_workflow

name: Deploy docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: kunobi-ninja/kache-action@v1

      - name: Build imp
        run: cargo build --release --manifest-path crates/imp/Cargo.toml

      - name: Upload imp binary
        uses: actions/upload-artifact@v4
        with:
          name: imp-linux
          path: target/release/imp

  check:
    needs: build
    runs-on: ubuntu-latest
    env:
      IMP_REMOTE_CACHE: ghac
      IMP_CHANGED_SINCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export GitHub Actions cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2 || '')

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Download imp binary
        uses: actions/download-artifact@v4
        with:
          name: imp-linux
          path: .

      - name: Make imp executable
        run: chmod +x imp

      - name: Cache imp store
        uses: actions/cache@v4
        with:
          path: ~/.cache/imp
          key: imp-store-v4-check-${{ runner.os }}-${{ hashFiles('imp.workspace.js', 'rules/**/*.lock') }}-${{ github.run_id }}
          restore-keys: |
            imp-store-v4-check-${{ runner.os }}-${{ hashFiles('imp.workspace.js', 'rules/**/*.lock') }}-
            imp-store-v4-check-${{ runner.os }}-

      - name: Check generated files
        run: ./imp goal generate //ci:docs_workflow --changed-since "$IMP_CHANGED_SINCE" --check

      - name: Check formatting
        run: ./imp fmt --check //... --changed-since "$IMP_CHANGED_SINCE"

      - name: Lint
        run: ./imp lint //... --changed-since "$IMP_CHANGED_SINCE"

      - name: Test
        run: ./imp test //... --changed-since "$IMP_CHANGED_SINCE"

      - name: Cache stats
        run: ./imp cache stats --details

      - name: Cache gc
        run: ./imp cache gc --apply

  package:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download imp binary
        uses: actions/download-artifact@v4
        with:
          name: imp-linux
          path: .

      - name: Make imp executable
        run: chmod +x imp

      - name: Cache imp store
        uses: actions/cache@v4
        with:
          path: ~/.cache/imp
          key: imp-store-v4-package-${{ runner.os }}-${{ hashFiles('imp.workspace.js', 'rules/**/*.lock') }}-${{ github.run_id }}
          restore-keys: |
            imp-store-v4-package-${{ runner.os }}-${{ hashFiles('imp.workspace.js', 'rules/**/*.lock') }}-
            imp-store-v4-package-${{ runner.os }}-

      - name: Package docs site
        run: ./imp package //docs:site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs/site/public

  deploy:
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
