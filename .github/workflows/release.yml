name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag does not match Cargo.toml version $crate" >&2
            exit 1
          fi

  linux:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (musl, static)
        run: cross build --release --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          tar -C target/x86_64-unknown-linux-musl/release -czf imp-x86_64-unknown-linux-musl.tar.gz imp

      - uses: actions/upload-artifact@v4
        with:
          name: imp-x86_64-unknown-linux-musl
          path: imp-x86_64-unknown-linux-musl.tar.gz

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        run: |
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/imp.exe -DestinationPath imp-x86_64-pc-windows-msvc.zip

      - uses: actions/upload-artifact@v4
        with:
          name: imp-x86_64-pc-windows-msvc
          path: imp-x86_64-pc-windows-msvc.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
