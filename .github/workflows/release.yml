name: Build release artifacts

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: cross build --release --locked --target x86_64-unknown-linux-musl

      - name: Smoke test
        run: target/x86_64-unknown-linux-musl/release/imp --help

      - name: Package
        run: tar -C target/x86_64-unknown-linux-musl/release -czf imp-x86_64-unknown-linux-musl.tar.gz imp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: imp-x86_64-unknown-linux-musl
          path: imp-x86_64-unknown-linux-musl.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Smoke test
        run: ./target/x86_64-pc-windows-msvc/release/imp.exe --help

      - name: Package
        run: Compress-Archive -Path target/x86_64-pc-windows-msvc/release/imp.exe -DestinationPath imp-x86_64-pc-windows-msvc.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: imp-x86_64-pc-windows-msvc
          path: imp-x86_64-pc-windows-msvc.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    needs: [linux, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Confirm tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify artifacts
        run: |
          test -f dist/imp-x86_64-unknown-linux-musl.tar.gz
          test -f dist/imp-x86_64-pc-windows-msvc.zip

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/imp-x86_64-unknown-linux-musl.tar.gz
            dist/imp-x86_64-pc-windows-msvc.zip
