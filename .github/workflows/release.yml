# Generated by ci/gen_workflow.py — do not edit by hand.
# Regenerate with: imp goal generate //ci:docs_workflow

name: Build release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: kunobi-ninja/kache-action@v1

      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: cross build --release --locked --target x86_64-unknown-linux-musl --manifest-path crates/imp/Cargo.toml

      - name: Smoke test
        run: target/x86_64-unknown-linux-musl/release/imp --help

      - name: Stage release tree
        run: |
          mkdir -p imp-x86_64-unknown-linux-musl/bin imp-x86_64-unknown-linux-musl/share/imp
          cp target/x86_64-unknown-linux-musl/release/imp imp-x86_64-unknown-linux-musl/bin/imp
          cp -r rules imp-x86_64-unknown-linux-musl/share/imp/rules

      - name: Smoke test packaged tree
        run: ci/smoke_package.sh imp-x86_64-unknown-linux-musl

      - name: Package
        run: tar -czf imp-x86_64-unknown-linux-musl.tar.gz imp-x86_64-unknown-linux-musl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: imp-x86_64-unknown-linux-musl
          path: imp-x86_64-unknown-linux-musl.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - if: runner.os != 'Windows'
        uses: kunobi-ninja/kache-action@v1

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --manifest-path crates/imp/Cargo.toml

      - name: Stage release tree
        run: |
          New-Item -ItemType Directory -Force -Path imp-x86_64-pc-windows-msvc/bin, imp-x86_64-pc-windows-msvc/share/imp | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/imp.exe imp-x86_64-pc-windows-msvc/bin/imp.exe
          Copy-Item -Recurse rules imp-x86_64-pc-windows-msvc/share/imp/rules

      - name: Smoke test packaged tree
        run: |
          if (-not (Test-Path "imp-x86_64-pc-windows-msvc/share/imp/rules/init.js")) { throw "missing rules/init.js" }
          if (-not (Test-Path "imp-x86_64-pc-windows-msvc/share/imp/rules/rust/rust.lock")) { throw "missing rules/rust/rust.lock" }
          if (-not (Test-Path "imp-x86_64-pc-windows-msvc/share/imp/rules/gen/index.js")) { throw "missing rules/gen/index.js" }
          ./imp-x86_64-pc-windows-msvc/bin/imp.exe --help

      - name: Package
        run: Compress-Archive -Path imp-x86_64-pc-windows-msvc -DestinationPath imp-x86_64-pc-windows-msvc.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: imp-x86_64-pc-windows-msvc
          path: imp-x86_64-pc-windows-msvc.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  rolling_release:
    needs: [linux, windows]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify artifacts
        run: |
          test -f dist/imp-x86_64-unknown-linux-musl.tar.gz
          test -f dist/imp-x86_64-pc-windows-msvc.zip

      - name: Move rolling release tag
        run: |
          git tag --force main-preview "$GITHUB_SHA"
          git push --force origin "refs/tags/main-preview"

      - name: Create or update rolling draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: main-preview
          target_commitish: ${{ github.sha }}
          name: Latest main build
          body: Automated draft for `${{ github.sha }}` from `main`.
          draft: true
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/imp-x86_64-unknown-linux-musl.tar.gz
            dist/imp-x86_64-pc-windows-msvc.zip

  release:
    needs: [linux, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Confirm tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify artifacts
        run: |
          test -f dist/imp-x86_64-unknown-linux-musl.tar.gz
          test -f dist/imp-x86_64-pc-windows-msvc.zip

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/imp-x86_64-unknown-linux-musl.tar.gz
            dist/imp-x86_64-pc-windows-msvc.zip
