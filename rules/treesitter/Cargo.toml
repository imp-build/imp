[package]
name = "imp-treesitter"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "treesitter-roundtrip"
test = false

[[bin]]
name = "imp-treesitter-parse"
test = false

[dependencies]
anyhow = "1"
tree-sitter = "0.26"
tree-sitter-language = "0.1"
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
