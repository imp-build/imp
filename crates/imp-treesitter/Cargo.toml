[package]
name = "imp-treesitter"
version.workspace = true
edition.workspace = true

[[bin]]
name = "treesitter-roundtrip"
# Run only via `imp test //crates/imp-treesitter:roundtrip`, which passes the
# grammar library path as an argument. `cargo test` must not build it as a
# libtest harness: it has no `#[test]` functions, so that harness runs zero
# tests and reports a misleading pass.
test = false

[[bin]]
name = "imp-treesitter-parse"
test = false

[dependencies]
anyhow.workspace = true
tree-sitter.workspace = true
tree-sitter-language.workspace = true
libloading.workspace = true
serde.workspace = true
serde_json.workspace = true
