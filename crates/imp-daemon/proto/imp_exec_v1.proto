syntax = "proto3";
package imp.exec.v1;

message ExecTool { string name = 1; string cache = 2; string key = 3; string path = 4; repeated string bin_dirs = 5; }
message ExecOutput { string path = 1; string kind = 2; string named_cache_name = 3; string named_cache_key = 4; bool named_cache_shared = 5; }
message ExecAction { repeated string argv = 1; string display = 2; map<string,string> env = 3; string config_digest = 4; string input_digest = 5; repeated ExecOutput outputs = 6; repeated ExecTool tools = 7; bool impure = 8; bool force_cache = 9; bool no_cache = 10; uint32 sandbox_retention = 11; bool allow_failure = 12; }
message ExecuteRequest { string workspace_id = 1; ExecAction action = 2; }
message CachedArtifact { string artifact_id = 1; string kind = 2; string path = 3; string digest = 4; uint64 bytes = 5; uint32 mode = 6; string tree_digest = 7; string named_cache_name = 8; string named_cache_key = 9; bool named_cache_shared = 10; }
message Started { string display = 1; }
message Outcome { int32 exit_code = 1; string stdout = 2; string stderr = 3; string output_digest = 4; repeated CachedArtifact outputs = 5; uint32 cache_outcome = 6; }
message Failure { string message = 1; }
message Finished { oneof result { Outcome outcome = 1; Failure failure = 2; } }
message ExecuteEvent { oneof event { Started started = 1; Finished finished = 2; } }
message CacheDirRequest { string workspace_id = 1; string name = 2; string key = 3; string source = 4; }
message CacheDirResponse { bool present = 1; string path = 2; }
message FetchRequest { string url = 1; }
message PathResponse { string path = 1; }
message ExtractRequest { string archive = 1; string dest = 2; string format = 3; uint32 strip_components = 4; }
message FileRequest { string path = 1; }
message FileResponse { string digest = 1; }
message FileSizeResponse { uint64 size = 1; }
message NativeToolRequest { string name = 1; string path = 2; }
message WorkerRequest { string workspace_id = 1; string name = 2; repeated string argv = 3; repeated string env = 4; repeated string health_check_argv = 5; }
message WorkerResponse { string home_dir = 1; string tmp_dir = 2; uint32 port = 3; bool present = 4; }
message Empty {}
message Capabilities { uint32 protocol_version = 1; string build_version = 2; string exe_fingerprint = 3; uint32 pid = 4; string os = 5; string arch = 6; }

service Execution { rpc Execute(ExecuteRequest) returns (stream ExecuteEvent); rpc CacheDirGet(CacheDirRequest) returns (CacheDirResponse); rpc CacheDirHas(CacheDirRequest) returns (CacheDirResponse); rpc CacheDirPut(CacheDirRequest) returns (Empty); rpc FetchUrl(FetchRequest) returns (PathResponse); rpc ExtractArchive(ExtractRequest) returns (Empty); rpc FileSha256(FileRequest) returns (FileResponse); rpc FileSize(FileRequest) returns (FileSizeResponse); rpc RegisterNativeTool(NativeToolRequest) returns (PathResponse); rpc WorkerStart(WorkerRequest) returns (WorkerResponse); rpc WorkerGet(WorkerRequest) returns (WorkerResponse); rpc GetCapabilities(Empty) returns (Capabilities); rpc Shutdown(Empty) returns (Empty); }
