[package]
name = "imp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "imp"
path = "src/main.rs"

[dependencies]
tokio        = { version = "1",    features = ["full"] }
clap         = { version = "4",    features = ["derive"] }
prodash      = { version = "31",   features = ["local-time", "render-line", "render-line-crossterm", "signal-hook"] }
anyhow       = "1"
serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
walkdir      = "2"
regex        = "1"
rusqlite     = { version = "0.31", features = ["bundled"] }
sha2         = "0.10"
tempfile     = "3"
futures      = { version = "0.3", default-features = false, features = ["std"] }
rquickjs     = { version = "0.12", features = ["loader", "futures", "macro"] }
signal-hook  = "0.4"

[profile.dev]
opt-level = 1
